<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Web Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>My Tasks</h1>
            </div>
            
            <section class="dashboard" aria-live="polite">
                <div class="main-stats">
                    <div class="stats-info">
                        <span>전체 진행률</span>
                        <span id="overall-progress-text">0/0 완료 (0%)</span>
                    </div>
                    <div class="progress-bar-track">
                        <div id="overall-progress-fill" class="progress-bar-fill"></div>
                    </div>
                </div>
                <div id="cheer-message" class="cheer-message">오늘도 힘내세요!</div>
                
                <div class="category-mini-stats" id="category-stats"></div>
                
                <div id="quote-container" class="quote-container">
                    <p id="quote-text">"할 수 있다고 믿는다면, 당신은 이미 절반은 온 것입니다."</p>
                </div>
            </section>

            <nav class="filter-nav">
                <h3>카테고리</h3>
                <div class="filter-section">
                    <button class="filter-btn active" data-filter="all">전체보기</button>
                    <button class="filter-btn" data-filter="work">업무</button>
                    <button class="filter-btn" data-filter="personal">개인</button>
                    <button class="filter-btn" data-filter="study">공부</button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="today-stats">오늘 추가됨: <span id="today-count">0</span></div>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div class="search-section">
                    <input type="text" id="search-input" placeholder="할 일 검색... (Alt+S)" autocomplete="off">
                </div>
                <div class="header-actions">
                    <button id="export-btn" class="icon-btn" title="데이터 내보내기">📤</button>
                    <button id="import-btn-trigger" class="icon-btn" title="데이터 가져오기">📥</button>
                    <input type="file" id="import-input" accept=".json" class="hidden">
                    <button id="theme-toggle" title="테마 변경 (Alt+D)">
                        <span class="sun-icon">☀️</span>
                        <span class="moon-icon">🌙</span>
                    </button>
                </div>
            </header>

            <div class="content-body">
                <div class="input-container">
                    <div class="input-section">
                        <select id="category-select">
                            <option value="work">업무</option>
                            <option value="personal">개인</option>
                            <option value="study">공부</option>
                        </select>
                        <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요... (Alt+N)" autocomplete="off">
                        <button id="add-btn">추가</button>
                    </div>
                    <div class="sort-section">
                        <label for="sort-select">정렬:</label>
                        <select id="sort-select">
                            <option value="manual">수동 (드래그)</option>
                            <option value="newest">최신순</option>
                            <option value="oldest">오래된순</option>
                            <option value="category">카테고리순</option>
                            <option value="status">완료 상태순</option>
                        </select>
                    </div>
                </div>

                <div class="list-container">
                    <ul id="todo-list" class="todo-list"></ul>
                    <div id="empty-state" class="empty-state hidden">
                        <p>할 일이 없습니다. 새로운 작업을 시작해보세요!</p>
                    </div>
                </div>

                <div class="list-footer">
                    <span id="items-left">0개 남음</span>
                    <button id="clear-completed" class="text-btn">완료된 항목 삭제</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Undo Snackbar -->
    <div id="undo-snackbar" class="snackbar hidden">
        <span>항목이 삭제되었습니다.</span>
        <button id="undo-btn">복구</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

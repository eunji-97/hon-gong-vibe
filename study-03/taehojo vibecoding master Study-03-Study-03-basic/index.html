<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 게임 - 지식의 도전</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 시작 화면 -->
        <div id="startScreen" class="screen active">
            <div class="start-content">
                <h1 class="title">🎯 퀴즈 게임</h1>
                <p class="subtitle">다양한 모드로 지식을 도전해보세요!</p>
                
                <div class="mode-selection">
                    <h3>게임 모드 선택</h3>
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="full">
                            <span class="mode-icon">🏆</span>
                            <span class="mode-name">전체 도전</span>
                            <span class="mode-desc">40문제 풀기</span>
                        </button>
                        <button class="mode-btn" data-mode="category">
                            <span class="mode-icon">📁</span>
                            <span class="mode-name">카테고리</span>
                            <span class="mode-desc">10문제 선택</span>
                        </button>
                        <button class="mode-btn" data-mode="speed">
                            <span class="mode-icon">⚡</span>
                            <span class="mode-name">스피드 퀴즈</span>
                            <span class="mode-desc">15초 타임어택</span>
                        </button>
                    </div>
                </div>

                <div id="categorySelection" class="category-selection hidden">
                    <h3>카테고리 선택</h3>
                    <div class="category-buttons">
                        <button class="cat-btn" data-category="한국사">🏛️ 한국사</button>
                        <button class="cat-btn" data-category="세계지리">🌍 세계지리</button>
                        <button class="cat-btn" data-category="과학">🔬 과학</button>
                        <button class="cat-btn" data-category="예술과 문화">🎨 예술과 문화</button>
                    </div>
                </div>

                <button id="startBtn" class="btn btn-primary">게임 시작</button>
            </div>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <div class="header-left">
                    <div class="progress-info">
                        <span id="currentQuestion">1</span> / <span id="totalQuestions">40</span>
                    </div>
                    <div class="score-info">
                        점수: <span id="currentScore">0</span>
                    </div>
                </div>
                <div class="header-right">
                    <div id="timerContainer" class="timer-container">
                        ⏱️ <span id="timer">00</span>s
                    </div>
                    <div id="comboContainer" class="combo-container hidden">
                        COMBO <span id="comboCount">0</span>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div class="quiz-content">
                <div class="quiz-controls">
                    <div class="category-badge" id="categoryBadge">한국사</div>
                    <div class="action-buttons">
                        <button id="hintBtn" class="btn-icon" title="힌트 (남은 횟수: 3)">💡 <span id="hintCount">3</span></button>
                        <button id="pauseBtn" class="btn-icon" title="일시정지">⏸️</button>
                    </div>
                </div>
                <h2 id="questionText" class="question">문제가 여기 표시됩니다</h2>

                <div id="optionsContainer" class="options-container">
                    <!-- 옵션들이 동적으로 생성됨 -->
                </div>
            </div>

            <!-- 피드백 모달 -->
            <div id="feedbackModal" class="feedback-modal">
                <div class="feedback-content">
                    <div id="feedbackIcon" class="feedback-icon"></div>
                    <h3 id="feedbackTitle">정답!</h3>
                    <p id="feedbackExplanation">설명이 여기 표시됩니다</p>
                    <button id="nextBtn" class="btn btn-secondary">다음 문제</button>
                </div>
            </div>

            <!-- 일시정지 모달 -->
            <div id="pauseModal" class="feedback-modal">
                <div class="feedback-content">
                    <h3>일시정지</h3>
                    <p>게임을 잠시 멈췄습니다.</p>
                    <button id="resumeBtn" class="btn btn-primary">계속하기</button>
                </div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="resultScreen" class="screen">
            <div class="result-content">
                <h1 class="result-title">🏆 퀴즈 완료!</h1>

                <div class="result-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="finalScore">0</div>
                        <div class="stat-label">최종 점수</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="correctCount">0</div>
                        <div class="stat-label">정답 개수</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="accuracyRate">0%</div>
                        <div class="stat-label">정답률</div>
                    </div>
                </div>

                <div class="detailed-stats">
                    <div class="detail-item">
                        <span class="detail-label">평균 응답 시간</span>
                        <span class="detail-value" id="avgTime">0.0초</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">최대 연속 정답</span>
                        <span class="detail-value" id="maxStreak">0회</span>
                    </div>
                </div>

                <div class="category-results" id="categoryResults">
                    <!-- 카테고리별 결과가 동적으로 생성됨 -->
                </div>

                <div class="result-actions">
                    <button id="restartBtn" class="btn btn-primary">다시 시작</button>
                </div>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
